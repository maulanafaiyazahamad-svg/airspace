<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Shahzad</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
</head>
<body class="at-home">

<video id="cam" playsinline muted autoplay></video>
<canvas id="gl" hidden></canvas>

<!-- Air keyboard -->
<div id="kbMode" class="mode skin-hacker" hidden>
  <canvas id="rain"></canvas>
  <div class="scan"></div>
  <div id="term">
    <div class="tbar"><i></i><i></i><i></i><span>root@shahzad:~/air-type</span></div>
    <div class="name" id="kbName" hidden>SHAHZAD</div>
    <div id="kbText"></div>
  </div>
  <div id="kbStage">
    <div id="kbShadow"></div>
    <div id="kb"></div>
  </div>
</div>

<!-- Robot -->
<div id="rbMode" class="mode" hidden>
  <div id="rbBlast"></div>
</div>

<!-- Shakti -->
<div id="pwMode" class="mode" hidden></div>

<canvas id="fx"></canvas>

<div id="bar" hidden>
  <button id="back" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span id="lamp" aria-label="Haath ka status"></span>
  <button id="torch" type="button" aria-label="Torch" hidden><svg viewBox="0 0 24 24"><path d="M13 2L5 14h6l-1 8 8-12h-6z"/></svg></button>
  <button id="flip" type="button" aria-label="Camera badlo"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9 13a3 3 0 0 1 5-2l1 1M15 13a3 3 0 0 1-5 2l-1-1"/></svg></button>
</div>

<div id="loading" hidden>
  <p id="loadMsg">Haath pehchanne wala system taiyaar ho raha hai</p>
  <div class="bar"><b id="loadBar"></b></div>
</div>

<canvas id="homeBg"></canvas>
<section id="home">
  <div class="brand">SHAHZAD</div>
  <h1>Kya chalana hai?</h1>
  <button class="card" type="button" data-go="kb">
    <svg viewBox="0 0 48 48"><rect x="4" y="12" width="40" height="24" rx="4"/><path d="M11 19h2M17 19h2M23 19h2M29 19h2M35 19h2M11 25h2M17 25h2M23 25h2M29 25h2M35 25h2M15 30h18"/></svg>
    <span><b>Air Keyboard</b><small>Hawa mein chutki se type karo</small></span>
  </button>
  <button class="card" type="button" data-go="power">
    <svg viewBox="0 0 48 48"><path d="M27 4L12 27h10l-3 17 17-25H25z"/></svg>
    <span><b>Shakti</b><small>Haath se bijli, aag ka gola, hawa mein roshni</small></span>
  </button>
  <button class="card" type="button" data-go="robot">
    <svg viewBox="0 0 48 48"><rect x="13" y="6" width="22" height="18" rx="5"/><path d="M18 15h12"/><rect x="10" y="27" width="28" height="15" rx="4"/><circle cx="24" cy="34" r="3"/><path d="M10 31H5v8M38 31h5v8"/></svg>
    <span><b>Robot</b><small>Haath se ghumao, todo, chur chur karo</small></span>
  </button>
  <div class="seg" role="group" aria-label="Camera">
    <button type="button" data-cam="environment">Peeche ka camera</button>
    <button type="button" data-cam="user">Saamne ka camera</button>
  </div>
  <p class="note">Light on rakho. Pehli baar camera ki permission <b>Allow</b> karna.</p>
  <p id="err" hidden></p>
  <div class="ver"><span id="ver"></span><button id="refresh" type="button">↻ Update lo</button></div>
</section>

<div id="splash"><canvas id="splashRain"></canvas><div class="sp-ring"></div><div class="sp-name" id="spName" data-t="SHAHZAD">SHAHZAD</div><div class="sp-line"></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
