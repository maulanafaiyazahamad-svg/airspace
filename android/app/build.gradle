plugins { id "com.android.application" }

android {
    namespace "com.shahzad.app"
    compileSdk 34
    defaultConfig {
        applicationId "com.shahzad.app"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "4.0"
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("SHAHZAD_KEYSTORE") ?: "shahzad.keystore")
            storePassword System.getenv("SHAHZAD_KEY_PASS") ?: "shahzad123"
            keyAlias "shahzad"
            keyPassword System.getenv("SHAHZAD_KEY_PASS") ?: "shahzad123"
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress += ["task", "wasm", "woff2"] }
}
